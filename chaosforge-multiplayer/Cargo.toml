[package]
name = "chaosforge-multiplayer"
version = "0.1.0"
edition = "2021"

[lib]
name = "chaosforge_multiplayer"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["bevy/default"]
ffi = []
multiplayer-physics = ["bevy_rapier3d", "bevy_renet"]

[dependencies]
# Core ECS and Game Engine
bevy = { version = "0.14", default-features = false, features = [
    "bevy_winit",
    "bevy_core_pipeline", 
    "bevy_render",
    "bevy_asset",
    "bevy_scene",
    "bevy_gilrs",
    "x11"
] }

# Physics Engine (ODE alternative - Rapier for better Rust integration)
bevy_rapier3d = { version = "0.26", optional = true }

# Networking
bevy_renet = { version = "0.0.11", optional = true }
renet = { version = "0.0.13", optional = true }
serde = { version = "1.0", features = ["derive"] }

# FFI and C Integration
libc = "0.2"
once_cell = "1.19"

# Math and Utilities
glam = "0.27"
uuid = { version = "1.0", features = ["v4", "serde"] }

[build-dependencies]
cbindgen = "0.26"
cc = "1.0"

[dev-dependencies]
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1  # Faster compilation for development